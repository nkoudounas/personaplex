# Local/dev override for docker-compose.yaml: localhost-only, plain HTTP, pick a GPU, choose the model cache.
#
#   echo "HF_TOKEN=hf_xxx" > .env
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d --build
#   ssh -L 8998:localhost:8998 <host>      # then open http://localhost:8998 (localhost counts as a secure context, so the mic works)
#
# Variables: GPU (default 0), MODEL_CACHE (default ./.cache/huggingface, holds the ~16 GB of weights).
services:
  personaplex:
    command: ["/app/moshi/.venv/bin/python", "-m", "moshi.server", "--host", "0.0.0.0", "--port", "8998"]
    ports: !override
      - "127.0.0.1:8998:8998"
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${GPU:-0}"]
              capabilities: [gpu]
    volumes: !override
      - ${MODEL_CACHE:-./.cache/huggingface}:/root/.cache/huggingface
